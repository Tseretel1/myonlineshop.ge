<div class="photo-container desktop">
    <div class="mobile-router" (click)="NavigateToDetails()" *ngIf="PhotoCongif.navigationAvailable"></div>

    <div class="photo-half">
        <img *ngIf="products.photos.length>0" [src]="products.photos[0].photoUrl" alt="" class="photo">
        <img *ngIf="products.photoUrl" [src]="products.photoUrl" alt="" class="photo">
    </div>

    <button type="button" class="like-button" *ngIf="PhotoCongif.likeVisible" [ngClass]="{'liked':postLiked}" (click)="likePost($event)">
        <i class="fas fa-heart" *ngIf="postLiked"></i>
        <i class="far fa-heart" *ngIf="!postLiked"></i>
        <span class="like-count" *ngIf="PhotoCongif.likeCountvisible">{{LikeCount}}</span>
    </button>

    <div class="badge-row" *ngIf="PhotoCongif.priceVisible">
        <app-discount-mark *ngIf="products.discountedPrice!=null&&products.discountedPrice>0" class="discount-procent" [discount]="products"></app-discount-mark>

        <div class="discount-price-mobile">
            <b [ngClass]="{'discounted-price': products.discountedPrice>0}" >{{products.price}}₾</b>
            <b *ngIf="products.discountedPrice>0">{{products.discountedPrice}}₾</b>
        </div>
    </div>

    <div class="info-half" [ngClass]="{'has-badges': PhotoCongif.likeVisible}">
        <p class="card-title">{{products.title}}</p>
        <div class="card-description-wrapper" *ngIf="products.description">
            <p class="card-description">{{products.description}}</p>
        </div>
    </div>
</div>

<div class="photo-container mobile" >
