  <div class="container" *ngIf="footer">
    <div class="footer-content">
        <div class="shop-info" *ngIf="footer.shopTitle">
            <div class="shop-logo">
                <img [src]="footer.shopPhoto" alt="" class="shop-img">
            </div>
            <p class="shop-name">{{footer.shopTitle}}</p>
        </div>
        <div class="social-row">
            <a class="social-icon instagram" *ngIf="footer.instagram" [href]="footer.instagram" target="_blank" aria-label="Instagram">
                <img src="assets/icons/instagram.svg" alt="">
            </a>
            <a class="social-icon facebook" *ngIf="footer.facebook" [href]="footer.facebook" target="_blank" aria-label="Facebook">
                <img src="assets/icons/facebook.svg" alt="">
            </a>
            <a class="social-icon tiktok" *ngIf="footer.tiktok" [href]="footer.tiktok" target="_blank" aria-label="TikTok">
                <img src="assets/icons/tiktok.svg" alt="">
            </a>
        </div>
    </div>
</div>
