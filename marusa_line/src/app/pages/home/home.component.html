
<div class="gallery-align" *ngIf="shop">
    <div class="shop-align">
        <div class="shop-header">
            <div class="shop-title-container">
                <div class="logo-title-align">
                    <div style="display: flex; align-items: center; gap: 5px;" *ngIf="shop">
                        <div class="shop-logo-container">
                            <img [src]="shop.logo" alt="" class="shop-logo">
                        </div>
                        <div class="shop-title">
                            <p class="sho-title-title" >{{shop.name}}</p>
                            <div class="followers-align">
                                <div class="followers">
                                    <p>{{shopStats.productCount}}</p>
                                    <p style="color:grey">posts</p> 
                                </div>
                                <div class="followers">
                                    <p>{{shopStats.followerCount}}</p>
                                    <p style="color:grey">followers</p>
                                </div>
                            </div>
                            <div class="followers-container-align">
                                <div class="followers-container" *ngFor="let u of followers">
                                    <img [src]="u.picture" alt="" class="follower-img">
                                </div>
                                <div class="followers" *ngIf="followers.length>0" style="display: flex; align-items: center; gap:5px; margin-left: 5px; color: grey; flex-wrap: wrap;">
                                    <!-- <p style="max-width: 270px; overflow: hidden;">{{followers[0].name}}</p> -->
                                    <!-- <p>and more</p>  -->
                                </div>
                            </div>
                            <button class="follow-button" [ngClass]="{'following':isShopFollowed}" (click)="followShop()">{{followString}} <i *ngIf="isShopFollowed" class="fas fa-check-double"></i> </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="shop-socials" *ngIf="shop.instagram || shop.facebook || shop.titkok">
            <a class="social-icon instagram" *ngIf="shop.instagram" [href]="shop.instagram" target="_blank" aria-label="Instagram">
                <img src="assets/icons/instagram.svg" alt="">
            </a>
            <a class="social-icon facebook" *ngIf="shop.facebook" [href]="shop.facebook" target="_blank" aria-label="Facebook">
                <img src="assets/icons/facebook.svg" alt="">
            </a>
            <a class="social-icon tiktok" *ngIf="shop.titkok" [href]="shop.titkok" target="_blank" aria-label="TikTok">
                <img src="assets/icons/tiktok.svg" alt="">
            </a>
        </div>
        <div class="shop-location" *ngIf="shop.location" (click)="copyLocation(shop.location)">
            <i class="fas fa-map-marker-alt"></i>
            <p>{{shop.location}}</p>
            <span class="copied" *ngIf="locationCopied"> ✅</span>
            <i class="fas fa-copy copy-icon" *ngIf="!locationCopied"></i>
        </div>
    </div>
    <div class="header-container">
    </div>
    <div class="gallery">
        <app-gallery *ngIf="shopId!=0" [ShopId]="shopId"></app-gallery>
    </div>
</div>

<!-- <app-footer class="footer" *ngIf="footer" [footer]="footer"></app-footer> -->
